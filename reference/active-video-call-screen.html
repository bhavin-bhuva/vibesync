<!DOCTYPE html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Active Video Call Screen</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ecec",
            "background-light": "#f6f8f8",
            "background-dark": "#102222",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .glass-overlay {
      background: rgba(16, 34, 34, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .pip-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-hidden">
  <!-- Main Video Feed Container -->
  <div class="relative h-screen w-full bg-black overflow-hidden flex flex-col items-center justify-center">
    <!-- Background Video (Doctor) -->
    <div class="absolute inset-0 z-0">
      <img alt="Doctor Feed" class="h-full w-full object-cover"
        data-alt="Professional female doctor in a white coat smiling during a video call"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDibEZJuRi_4YM5FA8YY-It5X5J5hCb3Jo193QHi4z-JFBUf8ViWeJPySxDQ0EHkjfc5jU-u06F-P06JH8VmJ3PSkEY4zZPvL0eT_nGTNXj8TZyBp7tn5XThp-EPSCuJ6xU7x2NjVzaX3wKj8PuF_qvaCNCHdoKpN3cwrfcZHRL-TQ8vyUhSa_ENBeQaz2PTWEFBopqmRbWISpVB7DJ-NgeaDFzSP6CFZPsuTB6Eod_qiq8bm8mVQy0iS_BrjQvs7yH2DTByBZXnq0" />
    </div>
    <!-- iOS Status Bar Placeholder -->
    <div class="absolute top-0 left-0 w-full h-12 flex items-center justify-between px-6 z-30">
      <span class="text-white text-sm font-semibold">9:41</span>
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined text-white text-sm">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-white text-sm">wifi</span>
        <span class="material-symbols-outlined text-white text-sm">battery_full</span>
      </div>
    </div>
    <!-- Top Right Picture-in-Picture (Patient) -->
    <div class="absolute top-16 right-4 w-28 h-40 rounded-xl overflow-hidden pip-shadow border border-white/20 z-20">
      <img alt="Patient Feed" class="h-full w-full object-cover"
        data-alt="Close up of a patient looking into the camera"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuANwEdxui_dDNZWzQ_o_mvKqx7OWodOD1akGm5doBA0PJ1cgsRborYvApNo_voJ2BRfN9FSmXHrS4jQGCXVmyniFaJ7PP4zV9nlDbbeiokSoMwfjbqjxUdDISQ2tJtXK2a4YGixUpMHyrZrJdzMkqNggZML9apT4Ud49sWlangZpK2MZSxi-AuE9FmNKEgjJs7cIultWKTBI8WWRXw1OYbC7RaZ_bWWoP5mVJ1DJaGWx6E1rVuXr8d4POCL4MiihFyN_cOkj-Q6mnU" />
      <div class="absolute bottom-2 right-2">
        <span class="material-symbols-outlined text-white text-xs bg-black/40 p-1 rounded-full">flip_camera_ios</span>
      </div>
    </div>
    <!-- Bottom Controls Overlay -->
    <div class="absolute bottom-0 left-0 w-full z-30">
      <!-- Curved Glass Effect Container -->
      <div class="glass-overlay rounded-t-[2.5rem] px-8 pt-8 pb-10 flex flex-col items-center space-y-6">
        <!-- Main Control Buttons -->
        <div class="flex items-center justify-center gap-8 w-full">
          <!-- Mute Button -->
          <div class="flex flex-col items-center gap-2">
            <button
              class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors">
              <span class="material-symbols-outlined text-white text-2xl">mic</span>
            </button>
            <span class="text-white/60 text-[10px] uppercase tracking-wider font-bold">Mute</span>
          </div>
          <!-- End Call Button (Center Primary) -->
          <div class="flex flex-col items-center gap-2">
            <button
              class="w-20 h-20 rounded-full bg-red-500 flex items-center justify-center shadow-lg shadow-red-500/30 active:scale-95 transition-transform">
              <span class="material-symbols-outlined text-white text-4xl"
                style="font-variation-settings: 'FILL' 1;">call_end</span>
            </button>
            <span class="text-white/60 text-[10px] uppercase tracking-wider font-bold">End</span>
          </div>
          <!-- Flip Camera Button -->
          <div class="flex flex-col items-center gap-2">
            <button
              class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors">
              <span class="material-symbols-outlined text-white text-2xl">flip_camera_android</span>
            </button>
            <span class="text-white/60 text-[10px] uppercase tracking-wider font-bold">Flip</span>
          </div>
        </div>
        <!-- Doctor Info & Duration -->
        <div class="w-full flex flex-col items-center">
          <h2 class="text-white text-xl font-bold tracking-tight">Dr. Livia Workman</h2>
          <div class="flex items-center gap-2 mt-1">
            <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            <p class="text-primary font-medium text-sm">15:03 min</p>
          </div>
        </div>
        <!-- iOS Home Indicator -->
        <div class="w-32 h-1 bg-white/30 rounded-full mt-4"></div>
      </div>
    </div>
    <!-- Top Left Info Overlay -->
    <div class="absolute top-16 left-6 z-20 flex items-center gap-3">
      <div class="bg-black/40 backdrop-blur-md rounded-full px-4 py-2 flex items-center gap-2 border border-white/10">
        <span class="material-symbols-outlined text-primary text-sm"
          style="font-variation-settings: 'FILL' 1;">verified</span>
        <span class="text-white text-xs font-semibold tracking-wide">Secure Call</span>
      </div>
    </div>
  </div>
</body>

</html>
