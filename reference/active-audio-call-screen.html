<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Simplified Audio Call Screen</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7f13ec",
            "background-light": "#f7f6f8",
            "background-dark": "#120a1a",
            "error-red": "#ff453a",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .call-gradient {
            background: radial-gradient(circle at center, #2e1052 0%, #120a1a 100%);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
  <div class="relative flex h-screen w-full flex-col call-gradient max-w-md mx-auto overflow-hidden">
    <div class="flex items-center justify-between p-6 pt-12">
      <button
        class="flex items-center justify-center size-10 rounded-full bg-white/10 hover:bg-white/20 transition-colors">
        <span class="material-symbols-outlined text-white">expand_more</span>
      </button>
      <div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary/20 border border-primary/30">
        <div class="size-2 rounded-full bg-green-400 animate-pulse"></div>
        <span class="text-xs font-semibold uppercase tracking-widest text-primary-200">End-to-End Encrypted</span>
      </div>
      <button
        class="flex items-center justify-center size-10 rounded-full bg-white/10 hover:bg-white/20 transition-colors">
        <span class="material-symbols-outlined text-white">more_horiz</span>
      </button>
    </div>
    <div class="flex flex-1 flex-col items-center justify-center px-8 text-center">
      <div class="relative mb-8">
        <div class="absolute inset-0 bg-primary/30 blur-3xl rounded-full scale-125"></div>
        <div class="relative size-48 rounded-full border-4 border-primary/20 p-1">
          <div class="h-full w-full rounded-full bg-cover bg-center overflow-hidden"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDNkDofnrNDfWloOha-SW-pRTktw_GL5etr3cVI-BRhbZjgNxzv6231YtEcIWqoKl6McmehE7_0EUEy-dKTAsmHLwupZM3BgfQU29AUUnC_EpOuTjmvsBSHBW6gsu3CsRs-wrtA9WOfGASShJoykwNjx0UdgBFnMruPiUgRNvMekpBQYxGIcRAgDZ37BKgja08EfBp_VkJN9vGbXlNOl899SpVLu3sujkN8hkPOy7KCMs7kS5-TCyA25JNw980iHlfJjhAbAOdEkbM");'>
          </div>
        </div>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Dr. Livia Workman</h1>
      <p class="text-primary/70 text-lg font-medium mb-6">Calling...</p>
      <div class="flex gap-3">
        <div class="flex flex-col items-center">
          <div class="flex h-12 w-16 items-center justify-center rounded-2xl glass-panel text-2xl font-bold">
            05
          </div>
          <span class="mt-2 text-[10px] uppercase tracking-widest text-white/40 font-bold">Minutes</span>
        </div>
        <div class="flex h-12 items-center text-2xl font-bold text-white/40">:</div>
        <div class="flex flex-col items-center">
          <div class="flex h-12 w-16 items-center justify-center rounded-2xl glass-panel text-2xl font-bold">
            24
          </div>
          <span class="mt-2 text-[10px] uppercase tracking-widest text-white/40 font-bold">Seconds</span>
        </div>
      </div>
    </div>
    <div class="px-8 pb-16">
      <div class="flex justify-center gap-12 mb-12">
        <div class="flex flex-col items-center gap-3">
          <button
            class="flex size-20 items-center justify-center rounded-full glass-panel hover:bg-white/20 transition-all active:scale-95">
            <span class="material-symbols-outlined text-3xl">mic_off</span>
          </button>
          <span class="text-sm font-medium text-white/60">Mute</span>
        </div>
        <div class="flex flex-col items-center gap-3">
          <button
            class="flex size-20 items-center justify-center rounded-full bg-white text-background-dark hover:bg-white/90 transition-all active:scale-95">
            <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1">volume_up</span>
          </button>
          <span class="text-sm font-bold text-white">Speaker</span>
        </div>
      </div>
      <div class="flex justify-center">
        <button
          class="flex h-20 w-full max-w-[280px] items-center justify-center gap-4 rounded-full bg-error-red text-white shadow-2xl shadow-error-red/30 hover:brightness-110 active:scale-95 transition-all">
          <div class="flex size-12 items-center justify-center rounded-full bg-white/20">
            <span class="material-symbols-outlined text-3xl rotate-[135deg]">call_end</span>
          </div>
          <span class="text-xl font-bold">End Call</span>
        </button>
      </div>
    </div>
    <div class="h-8 w-full flex justify-center items-end pb-2">
      <div class="w-32 h-1.5 bg-white/20 rounded-full"></div>
    </div>
  </div>
  <div class="fixed inset-0 -z-10 pointer-events-none opacity-20">
    <div class="absolute top-0 right-0 w-96 h-96 bg-primary rounded-full blur-[120px]"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 bg-purple-900 rounded-full blur-[100px]"></div>
  </div>

</body>

</html>
